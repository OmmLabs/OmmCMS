name: OmmCMS one-time internal identity migration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ommcms-rename.yml'
      - '.github/rename-ommcms.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rename-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_ROLL_FORWARD: Major
      MSBUILDTERMINALLOGGER: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Rename first-party source and assets
        run: python3 .github/rename-ommcms.py
      - run: dotnet restore OmmCMS.sln
      - run: dotnet build OmmCMS.sln -c Release --no-restore
      - run: dotnet test OmmCMS.sln -c Release --no-build --no-restore --logger trx
      - run: dotnet publish src/OmmCMS.Web/OmmCMS.Web.csproj -c Release --no-build --no-restore -o "$RUNNER_TEMP/ommcms-smoke"
      - name: Fresh installation and regression checks
        run: python3 .github/ommcms-smoke.py "$RUNNER_TEMP/ommcms-smoke" --editorial --trimmed --controllers-trimmed --public-controllers-trimmed --account-trimmed --admin-commerce-trimmed --residual-commerce-trimmed --presentation-trimmed --core-commerce-trimmed
      - name: Publish validated rename to main
        run: |
          git rm -- .github/rename-ommcms.py .github/workflows/ommcms-rename.yml .github/ommcms-sixlabors.lic
          git config user.name 'OmmLabs'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat | tail -1
          git commit -m 'Rename first-party OmmCMS project paths, namespaces and assemblies'
          git push origin HEAD:main
