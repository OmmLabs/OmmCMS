name: OmmCMS baseline - build and test

on:
  push:
    branches:
      - cms-baseline
      - cms-shell
      - cms-admin-navigation
      - cms-commerce-isolation
      - cms-installation
      - cms-editorial-workflows
      - cms-module-extraction
      - cms-controller-extraction
      - cms-public-commerce-extraction
      - cms-account-dependency-extraction
      - cms-admin-commerce-extraction
      - cms-residual-commerce-extraction
      - cms-commerce-presentation-extraction
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ommcms-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test upstream baseline (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_ROLL_FORWARD: Major
      MSBUILDTERMINALLOGGER: 'off'
    steps:
      - name: Check out CMS baseline
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Environment information
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore Smartstore.sln

      - name: Build solution
        run: dotnet build Smartstore.sln -c Release --no-restore

      - name: Run existing tests
        run: dotnet test Smartstore.sln -c Release --no-build --no-restore --logger trx

      - name: Publish disposable CMS application
        if: github.ref_name == 'cms-installation' || github.ref_name == 'cms-editorial-workflows' || github.ref_name == 'cms-module-extraction' || github.ref_name == 'cms-controller-extraction' || github.ref_name == 'cms-public-commerce-extraction' || github.ref_name == 'cms-account-dependency-extraction' || github.ref_name == 'cms-admin-commerce-extraction' || github.ref_name == 'cms-residual-commerce-extraction' || github.ref_name == 'cms-commerce-presentation-extraction'
        run: dotnet publish src/Smartstore.Web/Smartstore.Web.csproj -c Release --no-build --no-restore -o "$RUNNER_TEMP/ommcms-smoke"

      - name: Fresh CMS installation smoke test (SQLite)
        if: github.ref_name == 'cms-installation' || github.ref_name == 'cms-editorial-workflows' || github.ref_name == 'cms-module-extraction' || github.ref_name == 'cms-controller-extraction' || github.ref_name == 'cms-public-commerce-extraction' || github.ref_name == 'cms-account-dependency-extraction' || github.ref_name == 'cms-admin-commerce-extraction' || github.ref_name == 'cms-residual-commerce-extraction' || github.ref_name == 'cms-commerce-presentation-extraction'
        run: |
          args=(--editorial --trimmed)
          if [[ "$GITHUB_REF_NAME" == "cms-controller-extraction" || "$GITHUB_REF_NAME" == "cms-public-commerce-extraction" || "$GITHUB_REF_NAME" == "cms-account-dependency-extraction" || "$GITHUB_REF_NAME" == "cms-admin-commerce-extraction" || "$GITHUB_REF_NAME" == "cms-residual-commerce-extraction" || "$GITHUB_REF_NAME" == "cms-commerce-presentation-extraction" ]]; then args+=(--controllers-trimmed); fi
          if [[ "$GITHUB_REF_NAME" == "cms-public-commerce-extraction" || "$GITHUB_REF_NAME" == "cms-account-dependency-extraction" || "$GITHUB_REF_NAME" == "cms-admin-commerce-extraction" || "$GITHUB_REF_NAME" == "cms-residual-commerce-extraction" || "$GITHUB_REF_NAME" == "cms-commerce-presentation-extraction" ]]; then args+=(--public-controllers-trimmed); fi
          if [[ "$GITHUB_REF_NAME" == "cms-account-dependency-extraction" || "$GITHUB_REF_NAME" == "cms-admin-commerce-extraction" || "$GITHUB_REF_NAME" == "cms-residual-commerce-extraction" || "$GITHUB_REF_NAME" == "cms-commerce-presentation-extraction" ]]; then args+=(--account-trimmed); fi
          if [[ "$GITHUB_REF_NAME" == "cms-admin-commerce-extraction" || "$GITHUB_REF_NAME" == "cms-residual-commerce-extraction" || "$GITHUB_REF_NAME" == "cms-commerce-presentation-extraction" ]]; then args+=(--admin-commerce-trimmed); fi
          if [[ "$GITHUB_REF_NAME" == "cms-residual-commerce-extraction" || "$GITHUB_REF_NAME" == "cms-commerce-presentation-extraction" ]]; then args+=(--residual-commerce-trimmed); fi
          if [[ "$GITHUB_REF_NAME" == "cms-commerce-presentation-extraction" ]]; then args+=(--presentation-trimmed); fi
          python3 .github/ommcms-smoke.py "$RUNNER_TEMP/ommcms-smoke" "${args[@]}"

# No package push, external deployment or production database access.
